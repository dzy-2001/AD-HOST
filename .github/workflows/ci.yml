name: Test and build Windows app
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install plotting dependencies
        run: python -m pip install -r requirements.txt
      - name: Test TCP capture and command encoding
        run: python -m unittest discover -s tests -v
      - name: Qt6 acquisition, interaction and lifecycle smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          AD_HOST_SCREENSHOTS: screenshots
        run: python tools/qt_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qt6-screenshots-${{ matrix.os }}
          path: screenshots/
      - name: V26 GUI acquisition and trigger plot smoke test
        if: runner.os == 'Windows'
        run: python tools/v26_gui_smoke.py
      - name: GUI smoke test
        if: runner.os == 'Windows'
        run: python tools/gui_smoke.py
      - name: Offline plot popup smoke test
        if: runner.os == 'Windows'
        run: python tools/plot_smoke.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0 -r requirements.txt
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AD-HOST --collect-all qtawesome --exclude-module tkinter --exclude-module PySide6 run.py
      - name: Portable executable startup smoke test
        shell: pwsh
        run: |
          $appProcess = Start-Process -FilePath (Resolve-Path dist/AD-HOST/AD-HOST.exe) -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($appProcess.HasExited) { throw "Portable application exited during startup" }
          Stop-Process -Id $appProcess.Id
      - name: Pack documentation
        shell: pwsh
        run: |
          Copy-Item docs/QT6_QUICKSTART.md dist/AD-HOST/QT6_QUICKSTART.md
          Copy-Item docs/V26_QUICKSTART.md dist/AD-HOST/V26_QUICKSTART.md
          Copy-Item README.md dist/AD-HOST/README.md
          Copy-Item docs/QUICKSTART.md dist/AD-HOST/QUICKSTART.md
          Copy-Item docs/OFFLINE_PLOTTING.md dist/AD-HOST/OFFLINE_PLOTTING.md
      - uses: actions/upload-artifact@v4
        with:
          name: AD-HOST-Windows-x64
          path: dist/AD-HOST/
          retention-days: 30
