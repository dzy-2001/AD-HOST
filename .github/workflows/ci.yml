name: Test and build Windows app
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test TCP capture and command encoding
        run: python -m unittest discover -s tests -v
      - name: GUI smoke test
        if: runner.os == 'Windows'
        run: python tools/gui_smoke.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0
      - name: Build portable app
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name AD-HOST --collect-submodules tkinter run.py
      - name: Pack documentation
        shell: pwsh
        run: |
          Copy-Item README.md dist/AD-HOST/README.md
          Copy-Item docs/QUICKSTART.md dist/AD-HOST/QUICKSTART.md
      - uses: actions/upload-artifact@v4
        with:
          name: AD-HOST-Windows-x64
          path: dist/AD-HOST/
          retention-days: 30
