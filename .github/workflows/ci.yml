name: Test and build Windows app
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 fonts-noto-cjk
      - name: Install plotting dependencies
        run: python -m pip install -r requirements.txt
      - name: Test TCP capture and command encoding
        env:
          AD_HOST_SCREENSHOTS: screenshots
        run: python -m unittest discover -s tests -v
      - name: Qt6 acquisition, interaction and lifecycle smoke test
        env:
          AD_HOST_SCREENSHOTS: screenshots
        run: python tools/qt_smoke.py
      - name: V28 5 MSPS acquisition and waveform timebase smoke test
        env:
          AD_HOST_SCREENSHOTS: screenshots/v28
        run: python tools/qt_smoke.py --v28
      - name: Compare combo popup styles
        env:
          AD_HOST_SCREENSHOTS: screenshots
        run: python tools/qt_combo_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Qt6-screenshots-${{ matrix.os }}
          path: screenshots/
      - name: V26 GUI acquisition and trigger plot smoke test
        if: runner.os == 'Windows'
        run: python tools/v26_gui_smoke.py
      - name: GUI smoke test
        if: runner.os == 'Windows'
        run: python tools/gui_smoke.py
      - name: Offline plot popup smoke test
        if: runner.os == 'Windows'
        run: python tools/plot_smoke.py

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packaging tool
        run: python -m pip install pyinstaller==6.16.0 -r requirements.txt
      - name: Build single-file app
        run: python -m PyInstaller --noconfirm --clean build_app.spec
      - name: Packaged executable startup and icon smoke test
        run: python tools/packaged_smoke.py dist/AD-HOST.exe
      - name: Pack documentation
        shell: pwsh
        run: |
          Copy-Item docs/QT6_QUICKSTART.md dist/QT6_QUICKSTART.md
          Copy-Item docs/V26_QUICKSTART.md dist/V26_QUICKSTART.md
          Copy-Item README.md dist/README.md
          Copy-Item docs/QUICKSTART.md dist/QUICKSTART.md
          Copy-Item docs/OFFLINE_PLOTTING.md dist/OFFLINE_PLOTTING.md
      - uses: actions/upload-artifact@v4
        with:
          name: AD-HOST-Windows-x64
          path: dist/
          retention-days: 30
